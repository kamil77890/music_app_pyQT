<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Library</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="popup">
    <div class="header">
      <h1>Music Library Saver</h1>
      <span id="backend-status" class="offline">offline</span>
    </div>

    <div id="tab-card" class="card">
      <div id="current-url-display" class="url-display muted">No tab detected</div>
      <div id="tab-status-line" class="tab-status"></div>
    </div>

    <div class="actions">
      <button id="btn-save-tab" class="primary-btn" disabled>Save current YouTube</button>
      <button id="btn-open-sidebar" class="secondary-btn">Open Sidebar</button>
    </div>

    <div class="footer">
      <a href="http://localhost:8000/api/health" target="_blank">Backend &rarr; localhost:8000</a>
    </div>
  </div>
  <script src="../shared/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
