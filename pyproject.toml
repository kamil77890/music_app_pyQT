[project]
name = "music-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "mutagen>=1.47.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "google-api-python-client>=2.100.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "yt-dlp>=2024.1.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "srt>=3.5.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "librosa>=0.10.0",
    "pydub>=0.25.0",
    "anthropic>=0.97.0",
    "google-generativeai>=0.8.6",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
